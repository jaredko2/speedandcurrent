<!-- Create table modal -->
<div class="modal fade" id="modal-create" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Correction Table</h5>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <table class="table table-sm table-borderless">
          <tbody>
            <tr>
              <td>Table Name</td>
              <td><input type="text" id="create-name" class="form-control form-control-sm" placeholder="e.g. cat-twa-2026" style="width:180px"></td>
            </tr>
            <tr>
              <td>2nd Dimension Mode</td>
              <td>
                <select id="create-mode" class="form-select form-select-sm" style="width:180px">
                  <option value="twa" selected>TWA (True Wind Angle)</option>
                  <option value="heel">Heel Angle (Roll)</option>
                </select>
              </td>
            </tr>
            <tr>
              <td id="create-maxSpeed-label">Max speed (kn)</td>
              <td><input type="number" id="create-maxSpeed" class="form-control form-control-sm" value="12" min="1" max="30" step="1" style="width:80px"></td>
            </tr>
            <tr>
              <td id="create-speedStep-label">Speed step (kn)</td>
              <td><input type="number" id="create-speedStep" class="form-control form-control-sm" value="1" min="0.1" max="5" step="0.1" style="width:80px"></td>
            </tr>
            <tr id="row-create-maxDim2" style="display:none">
              <td id="create-maxDim2-label">Max heel (&deg;)</td>
              <td><input type="number" id="create-maxDim2" class="form-control form-control-sm" value="32" min="1" max="60" step="1" style="width:80px"></td>
            </tr>
            <tr id="row-create-dim2Step" style="display:none">
              <td id="create-dim2Step-label">Heel step (&deg;)</td>
              <td><input type="number" id="create-dim2Step" class="form-control form-control-sm" value="8" min="1" max="20" step="1" style="width:80px"></td>
            </tr>
          </tbody>
        </table>
        <div id="create-regime-note" class="small text-muted border-top pt-2 mt-2">
          <strong>Signed TWA Buckets:</strong> Generates 6 discrete column bins:<br>
          <code>[-145&deg;, -90&deg;, -40&deg;, +40&deg;, +90&deg;, +145&deg;]</code><br>
          (&lt;60&deg; Upwind, 60&deg;–120&deg; Reaching, &gt;120&deg; Downwind).
        </div>
      </div>
      <div class="modal-footer">
        <span id="modal-create-status" class="small text-danger mr-auto"></span>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-create-confirm">Create</button>
      </div>
    </div>
  </div>
</div>
